<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CBT Mock Test</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141a2e; --panel2:#1b2340; --border:#2a3358;
    --text:#e8ecf7; --muted:#9aa4c7; --blue:#3b5bfd; --green:#22c55e;
    --red:#ef4444; --amber:#f59e0b; --purple:#7c6ff0;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
  #topCandidateName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;}
  .timer{background:var(--panel2);padding:6px 14px;border-radius:20px;font-size:14px;border:1px solid var(--border);white-space:nowrap;}
  .submit-btn{background:var(--red);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:36px;}
  .submit-btn:hover{opacity:.9;}
  .layout{display:flex;gap:16px;padding:16px;max-width:1100px;margin:0 auto;align-items:flex-start;}
  .qpanel{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;min-width:0;}
  .qmeta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-bottom:14px;}
  .badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;}
  .easy{background:rgba(34,197,94,.15);color:var(--green);}
  .medium{background:rgba(245,158,11,.15);color:var(--amber);}
  .hard{background:rgba(239,68,68,.15);color:var(--red);}
  .qtext{font-size:17px;font-weight:500;margin-bottom:4px;}
  .qhindi{font-size:13px;color:var(--muted);margin-bottom:18px;}
  .option{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);margin-bottom:10px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;}
  .option:hover{border-color:var(--blue);}
  .option.selected{border-color:var(--blue);background:rgba(59,91,253,.15);}
  .option.correct{border-color:var(--green);background:rgba(34,197,94,.15);}
  .option.incorrect{border-color:var(--red);background:rgba(239,68,68,.15);}
  .optletter{width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .opttext{font-size:14px;}
  .footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px;}
  .navbtn{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 16px;min-height:40px;border-radius:8px;cursor:pointer;font-size:13px;-webkit-tap-highlight-color:transparent;}
  .navbtn:hover{border-color:var(--blue);}
  .navbtn:disabled{opacity:.35;cursor:not-allowed;}
  .clearbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:9px 4px;min-height:40px;}
  .nextbtn{background:linear-gradient(90deg,var(--blue),var(--purple));border:none;color:#fff;padding:9px 18px;min-height:40px;border-radius:8px;cursor:pointer;font-size:13px;-webkit-tap-highlight-color:transparent;}
  .sidebar{width:280px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;flex-shrink:0;}
  .sidebar h3{margin:0 0 10px;font-size:14px;}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .cell{aspect-ratio:1;min-height:36px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--text);-webkit-tap-highlight-color:transparent;}
  .cell.current{background:var(--blue);border-color:var(--blue);}
  .cell.answered{background:rgba(34,197,94,.25);border-color:var(--green);}
  .status{margin-top:12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;}
  .resultwrap{max-width:800px;margin:30px auto;padding:0 16px;}
  .scorecard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px;text-align:center;margin-bottom:20px;}
  .scorecard h1{margin:0 0 6px;font-size:34px;}
  .scorecard p{color:var(--muted);margin:4px 0;}
  .reviewq{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
  .reviewtag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;margin-left:8px;}
  .tagcorrect{background:rgba(34,197,94,.15);color:var(--green);}
  .tagwrong{background:rgba(239,68,68,.15);color:var(--red);}
  .tagskip{background:rgba(154,164,199,.15);color:var(--muted);}
  .centerwrap{max-width:520px;margin:60px auto;padding:0 16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;}
  .card h2{margin-top:0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:16px;}
  .field input:focus{outline:none;border-color:var(--blue);}
  .bigbtn{width:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border:none;color:#fff;padding:13px;min-height:44px;border-radius:10px;cursor:pointer;font-size:15px;margin-top:8px;-webkit-tap-highlight-color:transparent;}
  .bigbtn:disabled{opacity:.4;cursor:not-allowed;}
  .branchcard{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:20px;margin-bottom:14px;cursor:pointer;transition:.15s;}
  .branchcard:hover{border-color:var(--blue);}
  .branchcard.selected{border-color:var(--blue);background:rgba(59,91,253,.15);}
  .branchcard h3{margin:0 0 4px;font-size:16px;}
  .branchcard p{margin:0;color:var(--muted);font-size:13px;}
  .finalcard{text-align:center;}
  .finalcard .big{font-size:44px;font-weight:700;margin:10px 0;}
  .finalcard .thanks{font-size:20px;margin-top:14px;color:var(--green);}
  @media(max-width:800px){
    .layout{flex-direction:column;padding:12px;gap:12px;}
    .sidebar{width:100%;order:2;}
    .qpanel{order:1;padding:16px;}
  }
  @media(max-width:480px){
    .topbar{padding:8px 12px;}
    .avatar{width:26px;height:26px;font-size:12px;}
    #topCandidateName{font-size:13px;max-width:32vw;}
    .timer{padding:5px 10px;font-size:12px;}
    .submit-btn{padding:7px 12px;font-size:12px;}
    .qpanel{padding:14px;border-radius:10px;}
    .qtext{font-size:15px;}
    .option{padding:12px 12px;}
    .opttext{font-size:13.5px;}
    .footer{justify-content:space-between;}
    .navbtn,.nextbtn{padding:9px 12px;font-size:12.5px;}
    .grid{grid-template-columns:repeat(6,1fr);gap:5px;}
    .centerwrap{margin:24px auto;padding:0 12px;}
    .card{padding:22px 18px;}
    .scorecard{padding:20px;}
    .scorecard h1{font-size:28px;}
    .finalcard .big{font-size:34px;}
    .branchcard{padding:16px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="avatar" id="avatarInitial">?</div>
    <div style="font-size:14px;" id="topCandidateName">Candidate</div>
  </div>
  <div class="timer" id="timerBox" style="display:none;">⏱ <span id="timerDisplay">30:00</span></div>
  <button class="submit-btn" id="topSubmitBtn" style="display:none;" onclick="confirmSubmit()">Submit Test</button>
</div>

<!-- STEP 1: CANDIDATE DETAILS -->
<div id="detailsView" class="centerwrap">
  <div class="card">
    <h2>Candidate Details</h2>
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="candName" placeholder="Enter your full name">
    </div>
    <div class="field">
      <label>Roll No. / Registration No.</label>
      <input type="text" id="candRoll" placeholder="Enter your roll number">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="candEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="candPhone" placeholder="10-digit mobile number">
    </div>
    <button class="bigbtn" onclick="goToBranch()">Continue →</button>
  </div>
</div>

<!-- STEP 2: BRANCH SELECTION -->
<div id="branchView" class="centerwrap" style="display:none;">
  <div class="card">
    <h2>Select Your Branch</h2>
    <div class="branchcard selected" id="branchOption" onclick="selectBranch()">
      <h3>EEE / EE / ECE</h3>
      <p>Electrical & Electronics / Electrical / Electronics & Communication Engineering</p>
    </div>
    <button class="bigbtn" onclick="startExam()">Start Test →</button>
  </div>
</div>

<!-- STEP 3: QUIZ -->
<div id="quizView" class="layout" style="display:none;">
  <div class="qpanel">
    <div class="qmeta">
      <span id="qNumLabel">Question 1 of 60</span>
      <span class="badge easy" id="diffBadge">EASY</span>
      <span id="marksLabel" style="color:var(--green)"></span>
    </div>
    <div class="qtext" id="qText"></div>
    <div class="qhindi" id="qHindi"></div>
    <div id="optionsWrap"></div>
    <div class="footer">
      <button class="navbtn" id="prevBtn" onclick="goPrev()">← Previous</button>
      <button class="clearbtn" onclick="clearResponse()">Clear Response</button>
      <button class="nextbtn" id="nextBtn" onclick="goNext()">Next →</button>
    </div>
  </div>

  <div class="sidebar">
    <h3>Question Navigator</h3>
    <div class="legend">
      <span><span class="dot" style="background:var(--blue)"></span>Current</span>
      <span><span class="dot" style="background:var(--green)"></span>Answered</span>
    </div>
    <div class="grid" id="navGrid"></div>
    <div class="status">
      <span>Answered: <b id="answeredCount">0</b></span>
      <span>Remaining: <b id="remainingCount">60</b></span>
    </div>
  </div>
</div>

<!-- STEP 4: REVIEW -->
<div id="resultView" class="resultwrap" style="display:none;"></div>

<!-- STEP 5: FINAL -->
<div id="finalView" class="centerwrap" style="display:none;">
  <div class="card finalcard">
    <h2>Test Completed</h2>
    <p id="finalCandLine" style="color:var(--muted);"></p>
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--muted);">Marks Obtained</p>
    <div class="thanks">🎉 Thank you!</div>
    <button class="bigbtn" onclick="startExam()">Start Again →</button>
  </div>
</div>

<script>
/* ---------------- 200 QUESTION BANK ---------------- */
const bank = [
{id:1,diff:"HARD",marks:"+4 / -1",text:"A man's income is Rs 20000. He spends 60% on food. Savings are:",hindi:"एक व्यक्ति की आय 20000 रुपये है। वह 60% भोजन पर खर्च करता है। बचत है:",options:[{t:"Rs 12000"},{t:"Rs 8000"},{t:"Rs 10000"},{t:"Rs 6000"}],answer:1},
{id:2,diff:"EASY",marks:"+1 / -0.25",text:"Slope of the line y = 2x + 5 is:",hindi:"रेखा y = 2x + 5 की ढलान है:",options:[{t:"-2"},{t:"2"},{t:"5"},{t:"1"}],answer:1},
{id:3,diff:"MEDIUM",marks:"+2 / -0.5",text:"Two resistors 3Ω and 6Ω in parallel give:",hindi:"3Ω और 6Ω के दो प्रतिरोधक समानांतर में देते हैं:",options:[{t:"9Ω"},{t:"3Ω"},{t:"18Ω"},{t:"2Ω"}],answer:3},
{id:4,diff:"EASY",marks:"+1 / -0.25",text:"Roots of x² - 5x + 6 = 0 are:",hindi:"x² – 5x + 6 = 0 के मूल हैं:",options:[{t:"0, 5"},{t:"-2, -3"},{t:"1, 6"},{t:"2, 3"}],answer:3},
{id:5,diff:"MEDIUM",marks:"+2 / -0.5",text:"Per unit system is used to:",hindi:"प्रति इकाई प्रणाली का उपयोग होता है:",options:[{t:"Simplify power system analysis"},{t:"Control frequency"},{t:"Measure current"},{t:"Increase accuracy"}],answer:0},
{id:6,diff:"MEDIUM",marks:"+2 / -0.5",text:"Power = Work ÷:",hindi:"शक्ति = कार्य ÷:",options:[{t:"Force"},{t:"Mass"},{t:"Time"},{t:"Distance"}],answer:2},
{id:7,diff:"MEDIUM",marks:"+2 / -0.5",text:"If nPr = 20 and r = 2, then n is:",hindi:"यदि nPr = 20 और r = 2, तो n है:",options:[{t:"6"},{t:"4"},{t:"5"},{t:"10"}],answer:2},
{id:8,diff:"HARD",marks:"+4 / -1",text:"Ferranti effect causes the receiving end voltage to be:",hindi:"फेरांटी प्रभाव के कारण प्राप्त सिरे की वोल्टेज होगी:",options:[{t:"Less than sending end"},{t:"Equal to sending end"},{t:"Greater than sending end"},{t:"Zero"}],answer:2},
{id:9,diff:"MEDIUM",marks:"+2 / -0.5",text:"Thevenin's theorem replaces a network with:",hindi:"थेवेनिन का प्रमेय एक नेटवर्क को बदलता है:",options:[{t:"Two voltage sources"},{t:"Current source and parallel resistance"},{t:"Voltage source and series resistance"},{t:"Capacitor and inductor"}],answer:2},
{id:10,diff:"EASY",marks:"+1 / -0.25",text:"Ohm's law states V =",hindi:"ओम का नियम V =",options:[{t:"I-R"},{t:"IR"},{t:"I+R"},{t:"I/R"}],answer:1},
{id:11,diff:"EASY",marks:"+1 / -0.25",text:"The unit of electric charge is:",hindi:"विद्युत आवेश की इकाई है:",options:[{t:"Coulomb"},{t:"Ampere"},{t:"Volt"},{t:"Ohm"}],answer:0},
{id:12,diff:"EASY",marks:"+1 / -0.25",text:"Speed of light in vacuum is approximately:",hindi:"निर्वात में प्रकाश की गति लगभग है:",options:[{t:"3 × 10⁶ m/s"},{t:"3 × 10⁸ m/s"},{t:"3 × 10¹⁰ m/s"},{t:"3 × 10⁴ m/s"}],answer:1},
{id:13,diff:"MEDIUM",marks:"+2 / -0.5",text:"lim (x→0) sin x / x equals:",hindi:"lim (x→0) sin x / x बराबर है:",options:[{t:"0"},{t:"1"},{t:"∞"},{t:"π"}],answer:1},
{id:14,diff:"MEDIUM",marks:"+2 / -0.5",text:"Hysteresis loss in a transformer is proportional to:",hindi:"ट्रांसफार्मर में हिस्टेरिसिस हानि के अनुपातिक होती है:",options:[{t:"Frequency squared"},{t:"Frequency"},{t:"Current"},{t:"Voltage"}],answer:1},
{id:15,diff:"HARD",marks:"+4 / -1",text:"In Young's double slit, fringe width β =",hindi:"यंग द्विझिरी में फ्रिंज चौड़ाई β =",options:[{t:"Dd/λ"},{t:"λ/Dd"},{t:"λd/D"},{t:"λD/d"}],answer:3},
{id:16,diff:"EASY",marks:"+1 / -0.25",text:"Newton's second law states F =",hindi:"न्यूटन का दूसरा नियम कहता है F =",options:[{t:"mv"},{t:"ma"},{t:"mg"},{t:"mgh"}],answer:1},
{id:17,diff:"MEDIUM",marks:"+2 / -0.5",text:"Value of e⁰ is:",hindi:"e⁰ का मान है:",options:[{t:"0"},{t:"undefined"},{t:"1"},{t:"e"}],answer:2},
{id:18,diff:"EASY",marks:"+1 / -0.25",text:"An alternator converts:",hindi:"अल्टरनेटर परिवर्तित करता है:",options:[{t:"Mechanical to electrical energy"},{t:"AC to DC"},{t:"DC to AC"},{t:"Chemical to electrical"}],answer:0},
{id:19,diff:"MEDIUM",marks:"+2 / -0.5",text:"Resonance in RLC circuit occurs when:",hindi:"RLC सर्किट में अनुनाद तब होता है जब:",options:[{t:"R = L"},{t:"XL = XC"},{t:"L = C"},{t:"R = C"}],answer:1},
{id:20,diff:"EASY",marks:"+1 / -0.25",text:"The unit of electric charge is:",hindi:"विद्युत आवेश की इकाई है:",options:[{t:"Coulomb"},{t:"Ohm"},{t:"Ampere"},{t:"Volt"}],answer:0},
{id:21,diff:"MEDIUM",marks:"+2 / -0.5",text:"Energy of a photon E =",hindi:"फोटॉन की ऊर्जा E =",options:[{t:"hv"},{t:"v/h"},{t:"hc"},{t:"h/v"}],answer:0},
{id:22,diff:"HARD",marks:"+4 / -1",text:"Derivative of ln(x) is:",hindi:"ln(x) का अवकलज है:",options:[{t:"e^x"},{t:"1/x"},{t:"ln x"},{t:"x"}],answer:1},
{id:23,diff:"EASY",marks:"+1 / -0.25",text:"What is the SI unit of electric current?",hindi:"विद्युत धारा की SI इकाई क्या है?",options:[{t:"Ampere"},{t:"Watt"},{t:"Ohm"},{t:"Volt"}],answer:0},
{id:24,diff:"MEDIUM",marks:"+2 / -0.5",text:"Skin effect in AC conductors causes current to flow:",hindi:"AC चालकों में स्किन इफेक्ट के कारण धारा बहती है:",options:[{t:"Through center of conductor"},{t:"Near the surface of conductor"},{t:"Uniformly through cross section"},{t:"Only in one half"}],answer:1},
{id:25,diff:"MEDIUM",marks:"+2 / -0.5",text:"The speed of a DC shunt motor on no-load is:",hindi:"नो-लोड पर DC शंट मोटर की गति होती है:",options:[{t:"Infinite"},{t:"Zero"},{t:"Nearly constant (rated)"},{t:"Very low"}],answer:2},
{id:26,diff:"HARD",marks:"+4 / -1",text:"The value of Σ(k=1 to n) k is:",hindi:"Σ(k=1 से n) k का मान है:",options:[{t:"n²/2"},{t:"n²"},{t:"n(n+1)/2"},{t:"n(n+1)"}],answer:2},
{id:27,diff:"EASY",marks:"+1 / -0.25",text:"Three-phase supply has _ phases:",hindi:"तीन-फेज आपूर्ति में _ फेज होते हैं:",options:[{t:"1"},{t:"2"},{t:"3"},{t:"4"}],answer:2},
{id:28,diff:"MEDIUM",marks:"+2 / -0.5",text:"Norton's theorem replaces a network with:",hindi:"नॉर्टन का प्रमेय एक नेटवर्क को बदलता है:",options:[{t:"Voltage source and series resistance"},{t:"Two capacitors"},{t:"Current source and parallel resistance"},{t:"Inductor only"}],answer:2},
{id:29,diff:"HARD",marks:"+4 / -1",text:"HVDC transmission is preferred for:",hindi:"HVDC पारेषण के लिए पसंद किया जाता है:",options:[{t:"Domestic supply"},{t:"Very long distance bulk power transfer"},{t:"Short distance"},{t:"Distribution"}],answer:1},
{id:30,diff:"EASY",marks:"+1 / -0.25",text:"If log₂(x) = 3, then x is:",hindi:"यदि log₂(x) = 3, तो x है:",options:[{t:"16"},{t:"6"},{t:"9"},{t:"8"}],answer:3},
{id:31,diff:"MEDIUM",marks:"+2 / -0.5",text:"Statement: All cats are animals. Some animals are black. Conclusion: Some cats may be black. This is:",hindi:"कथन: सभी बिल्लियाँ जानवर हैं। कुछ जानवर काले हैं। निष्कर्ष: कुछ बिल्लियाँ काली हो सकती हैं। यह है:",options:[{t:"Definitely true"},{t:"Definitely false"},{t:"Possibly true"},{t:"Irrelevant"}],answer:2},
{id:32,diff:"MEDIUM",marks:"+2 / -0.5",text:"A step-up transformer increases:",hindi:"एक स्टेप-अप ट्रांसफार्मर बढ़ाता है:",options:[{t:"Current"},{t:"Voltage"},{t:"Frequency"},{t:"Power"}],answer:1},
{id:33,diff:"MEDIUM",marks:"+2 / -0.5",text:"IGBT stands for: (Choose the right option)",hindi:"IGBT का पूर्ण रूप है:",options:[{t:"Internal Gate Bypass Transistor"},{t:"Induction Gate Base Transistor"},{t:"Integrated Gate Bipolar Transistor"},{t:"Insulated Gate Bipolar Transistor"}],answer:3},
{id:34,diff:"MEDIUM",marks:"+2 / -0.5",text:"Synchronous speed of a motor depends on: (Choose the right option)",hindi:"मोटर की तुल्यकालिक गति _ पर निर्भर करती है:",options:[{t:"Load"},{t:"Supply frequency and number of poles"},{t:"Voltage"},{t:"Rotor resistance"}],answer:1},

/* ---------------- STATE ---------------- */
let candidate = {name:"",roll:"",email:"",phone:""};
let questions = [];
let current = 0;
let responses = [];
let timeLeft = 45*60;
let timerInterval;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---------------- STEP 1 -> 2 ---------------- */
function goToBranch(){
  const name = document.getElementById('candName').value.trim();
  const roll = document.getElementById('candRoll').value.trim();
  const email = document.getElementById('candEmail').value.trim();
  const phone = document.getElementById('candPhone').value.trim();
  if(!name || !roll || !phone){
    alert('Please fill in your Name, Roll No. and Phone Number to continue.');
    return;
  }
  candidate = {name,roll,email,phone};
  document.getElementById('topCandidateName').textContent = name;
  document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();
  document.getElementById('detailsView').style.display='none';
  document.getElementById('branchView').style.display='block';
}

function selectBranch(){
  document.getElementById('branchOption').classList.add('selected');
}

/* ---------------- STEP 2 -> 3 ---------------- */
function startExam(){
  document.getElementById('branchView').style.display='none';
  document.getElementById('quizView').style.display='flex';
  document.getElementById('timerBox').style.display='block';
  document.getElementById('topSubmitBtn').style.display='inline-block';

  questions = shuffle(bank).slice(0,60);
  responses = new Array(questions.length).fill(null);
  current = 0;
  timeLeft = 45*60;
  startTimer();
  renderQuestion();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){clearInterval(timerInterval); submitTest(); return;}
    const m=Math.floor(timeLeft/60), s=timeLeft%60;
    document.getElementById('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}

/* ---------------- QUIZ RENDER ---------------- */
function renderQuestion(){
  const q = questions[current];
  document.getElementById('qNumLabel').textContent = `Question ${current+1} of ${questions.length}`;
  const badge = document.getElementById('diffBadge');
  badge.textContent = q.diff;
  badge.className = 'badge ' + q.diff.toLowerCase();
  document.getElementById('marksLabel').textContent = q.marks;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('qHindi').textContent = q.hindi;

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt,idx)=>{
    const div = document.createElement('div');
    div.className = 'option' + (responses[current]===idx ? ' selected':'');
    div.onclick = ()=>selectOption(idx);
    div.innerHTML = `<span class="optletter">${letters[idx]}</span><span class="opttext">${opt.t}</span>`;
    wrap.appendChild(div);
  });

  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').textContent = current===questions.length-1 ? 'Finish' : 'Next →';
  renderNav();
}

function selectOption(idx){
  responses[current] = idx;
  renderQuestion();
}
function clearResponse(){
  responses[current] = null;
  renderQuestion();
}
function goNext(){
  if(current < questions.length-1){ current++; renderQuestion(); }
  else { confirmSubmit(); }
}
function goPrev(){
  if(current>0){ current--; renderQuestion(); }
}
function jumpTo(i){ current = i; renderQuestion(); }

function renderNav(){
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  questions.forEach((q,i)=>{
    const cell = document.createElement('div');
    let cls = 'cell';
    if(i===current) cls += ' current';
    else if(responses[i]!==null) cls += ' answered';
    cell.className = cls;
    cell.textContent = i+1;
    cell.onclick = ()=>jumpTo(i);
    grid.appendChild(cell);
  });
  const answeredCount = responses.filter(r=>r!==null).length;
  document.getElementById('answeredCount').textContent = answeredCount;
  document.getElementById('remainingCount').textContent = questions.length - answeredCount;
}

function confirmSubmit(){
  if(confirm('Submit the test? You cannot change answers after this.')){
    submitTest();
  }
}

let obtainedScore = 0;

/* ---------------- STEP 3 -> 4 (REVIEW) ---------------- */
function submitTest(){
  clearInterval(timerInterval);
  document.getElementById('quizView').style.display = 'none';
  document.getElementById('timerBox').style.display='none';
  document.getElementById('topSubmitBtn').style.display='none';
  const resultView = document.getElementById('resultView');
  resultView.style.display = 'block';

  let correct=0, wrong=0, skipped=0;
  let scoreValue=0;
  questions.forEach((q,i)=>{
    const marksArr = q.marks.replace(/[+\s]/g,'').split('/');
    const pos = parseFloat(marksArr[0]);
    const neg = parseFloat(marksArr[1]);
    if(responses[i]===null){ skipped++; }
    else if(responses[i]===q.answer){ correct++; scoreValue+=pos; }
    else { wrong++; scoreValue-=neg; }
  });
  obtainedScore = scoreValue;

  let html = `
  <div class="scorecard">
    <h1>${scoreValue.toFixed(2)}</h1>
    <p>Your Score</p>
    <p style="margin-top:14px;">
      <span style="color:var(--green)">${correct} Correct</span> &nbsp;•&nbsp;
      <span style="color:var(--red)">${wrong} Wrong</span> &nbsp;•&nbsp;
      <span style="color:var(--muted)">${skipped} Skipped</span>
    </p>
  </div>
  <h3 style="margin-bottom:14px;">Answer Review</h3>`;

  const letters = ['A','B','C','D'];
  questions.forEach((q,i)=>{
    let tag = '';
    if(responses[i]===null) tag = '<span class="reviewtag tagskip">Skipped</span>';
    else if(responses[i]===q.answer) tag = '<span class="reviewtag tagcorrect">Correct</span>';
    else tag = '<span class="reviewtag tagwrong">Wrong</span>';

    let optsHtml = '';
    q.options.forEach((opt,idx)=>{
      let cls='option';
      if(idx===q.answer) cls+=' correct';
      else if(idx===responses[i] && idx!==q.answer) cls+=' incorrect';
      optsHtml += `<div class="${cls}"><span class="optletter">${letters[idx]}</span><span class="opttext">${opt.t}</span></div>`;
    });

    html += `<div class="reviewq">
      <div class="qtext">Q${i+1}. ${q.text} ${tag}</div>
      <div class="qhindi" style="margin-bottom:10px;">${q.hindi}</div>
      ${optsHtml}
    </div>`;
  });

  html += `<button class="bigbtn" style="max-width:300px;margin:20px auto 60px;display:block;" onclick="finalSubmit()">Final Submit →</button>`;

  resultView.innerHTML = html;
  window.scrollTo(0,0);
}

/* ---------------- STEP 4 -> 5 (FINAL) ---------------- */
function finalSubmit(){
  document.getElementById('resultView').style.display='none';
  document.getElementById('finalView').style.display='block';
  document.getElementById('finalCandLine').textContent = `${candidate.name} (Roll No: ${candidate.roll}) — Branch: EEE / EE / ECE`;
  document.getElementById('finalScore').textContent = obtainedScore.toFixed(2);
  window.scrollTo(0,0);
}
</script>
